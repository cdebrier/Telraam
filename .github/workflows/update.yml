# Mise à jour hebdomadaire des données (option : ne sert que si le dépôt est sur GitHub).
# Lance update.py ; si les contrôles échouent, le job échoue et rien n'est commité.
name: Mise à jour des données
on:
  schedule:
    - cron: "0 5 * * 1"      # chaque lundi, 05:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: python3 -m unittest tests.test_year
      - run: python3 update.py
      - name: Commiter les données
        run: |
          git config user.name "telraam-bot"
          git config user.email "telraam-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore(data): mise à jour de l'année glissante et des profils"
          git push
